[package]
name = "live-versions"
version = "0.3.1"
edition = "2021"
description = "Version manager for Ableton Live sets, with a VST2/AU to VST3 converter"
build = "build.rs"

[[bin]]
name = "LiveVersions"
path = "src/main.rs"

[dependencies]
roxmltree = "0.20"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = "0.4"
plist = "1"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = "0.29"
rfd = "0.15"
sha1_smol = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_UI_HiDpi",
    "Win32_System_Diagnostics_ToolHelp",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
